<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ff6b9a">

  <title>A Very Important Question ❤️</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="card">

      <div class="emoji">💖</div>

      <h1>Hey! 👋</h1>

      <!-- CHANGE YOUR QUESTION HERE -->
      <p class="question" id="question">
        Will you be my friend forever? ❤️
      </p>

      <p class="message" id="message">
        Choose carefully... 😄
      </p>

      <div class="buttons">

        <button id="yesButton" class="btn yes" type="button">
          YES 😍
        </button>

        <button id="noButton" class="btn no" type="button">
          NO 😐
        </button>

      </div>

    </section>

  </main>

  <div
    id="confetti"
    class="confetti-container"
    aria-hidden="true"
  ></div>

  <script src="script.js"></script>

</body>
</html>
