<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ff5c8a">

  <title>A Little Question For You ❤️</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <div class="hearts" aria-hidden="true">
    <span>❤</span>
    <span>♡</span>
    <span>❤</span>
    <span>♡</span>
    <span>❤</span>
    <span>♡</span>
    <span>❤</span>
    <span>♡</span>
    <span>❤</span>
    <span>♡</span>
  </div>

  <main class="page">

    <section class="love-card" id="loveCard">

      <div class="top-heart">💗</div>

      <p class="tiny-text">A VERY IMPORTANT QUESTION</p>

      <h1>
        Do you<br>
        <span>love me?</span> 🥺❤️
      </h1>

      <p class="subtitle" id="subtitle">
        Be honest... my heart is watching 👀💕
      </p>

      <div class="question-heart">❤️</div>

      <div class="buttons">

        <button
          id="yesButton"
          class="love-button yes-button"
          type="button"
        >
          YES 💕
        </button>

        <button
          id="noButton"
          class="love-button no-button"
          type="button"
        >
          NO 😐
        </button>

      </div>

      <p class="hint" id="hint">
        Choose wisely 😌
      </p>

    </section>

  </main>


  <div
    class="success-screen"
    id="successScreen"
    aria-hidden="true"
  >

    <div class="success-content">

      <div class="big-heart">❤️</div>

      <p class="success-small">
        I KNEW IT!!!
      </p>

      <h2>
        You love me! 🥹💕
      </h2>

      <p>
        My heart officially has<br>
        a reason to celebrate. 🎉
      </p>

      <div class="success-hearts">
        ❤️ 💕 ❤️ 💕 ❤️
      </div>

      <button
        class="close-button"
        id="closeButton"
        type="button"
      >
        Okay... I'm blushing now 🙈
      </button>

    </div>

  </div>


  <div
    class="confetti-container"
    id="confettiContainer"
    aria-hidden="true"
  ></div>


  <script src="./script.js"></script>

</body>
</html>
